name: "Blog"
description: "Content-focused layout with timestamps. Great for articles and journals."
author: "Forestry.md"
image: "preview.png"
demoUrl: ""

settings:
  BASE_THEME: "light"
  THEME: ""
  dgHomeLink: "true"
  dgShowLocalGraph: "false"
  dgShowBacklinks: "false"
  dgShowToc: "true"
  dgShowInlineTitle: "true"
  dgShowFileTree: "false"
  dgEnableSearch: "true"
  dgLinkPreview: "false"
  dgShowTags: "true"
  SHOW_CREATED_TIMESTAMP: "true"
  SHOW_UPDATED_TIMESTAMP: "true"
  TIMESTAMP_FORMAT: "MMM dd, yyyy"

components:
  - templateId: "ui-theme-switcher"
    slot: "header"
    variables:
      iconColor: "#333333"
      iconColorDark: "#ffffff"
